services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uspg_academico
      POSTGRES_USER: uspg
      POSTGRES_PASSWORD: desarrollo_uspg
    ports:
      - "5432:5432"
    volumes:
      - uspg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uspg -d uspg_academico"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uspg_postgres_data:
