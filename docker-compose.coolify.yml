services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:?}
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://uspg:${POSTGRES_PASSWORD:?}@postgres:5432/uspg_academico
      PARKING_QR_SECRET: ${PARKING_QR_SECRET:?}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASS: ${SMTP_PASS:?}
      SMTP_FROM: ${SMTP_FROM:?}
      GOOGLE_CLASSROOM_CLIENT_ID: ${GOOGLE_CLASSROOM_CLIENT_ID:-}
      GOOGLE_CLASSROOM_CLIENT_SECRET: ${GOOGLE_CLASSROOM_CLIENT_SECRET:-}
      GOOGLE_CLASSROOM_REDIRECT_URI: ${GOOGLE_CLASSROOM_REDIRECT_URI:-}
      REDIS_URL: redis://redis:6379
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    expose:
      - "3000"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://uspg:${POSTGRES_PASSWORD:?}@postgres:5432/uspg_academico
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:postgres:migrate:deploy"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - uspg_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uspg_academico
      POSTGRES_USER: uspg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - uspg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uspg -d uspg_academico"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  uspg_postgres_data:
  uspg_redis_data:
  clamav_data:
